name: Build and Release IA VOCAL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compiler IA-VOCAL.exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name IA-VOCAL --collect-all webview --collect-all vosk --add-data "ia_vocal/ui;ia_vocal/ui" run.py

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Créer l'installateur IA-VOCAL-Setup.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Publier une nouvelle version GitHub avec le .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IA VOCAL v1.0.${{ github.run_number }}
          body: |
            Nouvelle version automatique de IA VOCAL.

            - Installateur Windows (recommandé) : IA-VOCAL-Setup.exe
            - Exécutable seul : IA-VOCAL.exe
            - Commit : ${{ github.sha }}
          files: |
            dist/IA-VOCAL.exe
            dist/IA-VOCAL-Setup.exe
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
