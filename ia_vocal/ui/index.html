<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #111827; --ink-doux: #374151; --muet: #4b5563;
    --c1: #7dd3fc; --c2: #6366f1; --c3: #a855f7;
    --rebond: cubic-bezier(0.175, 0.885, 0.32, 2.2);
  }
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink);
  }

  /* ---- Verre liquide : même principe que le composant de référence ---- */
  .carte {
    position: absolute; inset: 10px; box-sizing: border-box; border-radius: 32px;
    padding: 16px 20px 18px; isolation: isolate;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 6px 6px rgba(0,0,0,.2), 0 0 24px rgba(0,0,0,.12);
    transition: transform .7s var(--rebond), box-shadow .7s var(--rebond);
  }
  .carte:hover { transform: scale(1.005); }
  /* Couche de flou + déformation du fond */
  .carte::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 0;
    backdrop-filter: blur(4px) saturate(1.3); -webkit-backdrop-filter: blur(4px) saturate(1.3);
    filter: url(#verre-deforme);
  }
  /* Teinte blanche translucide et reflets sur les bords */
  .carte::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 1; pointer-events: none;
    background: rgba(255,255,255,.28);
    box-shadow:
      inset 2px 2px 1px 0 rgba(255,255,255,.6),
      inset -1px -1px 1px 1px rgba(255,255,255,.5);
  }
  .contenu { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 12px; height: 100%; }

  .haut { display: flex; align-items: center; gap: 16px; }
  .zone-drag { flex: 1; min-height: 84px; display: flex; flex-direction: column; justify-content: center; }
  .zone-orbe { position: relative; width: 84px; height: 84px; flex: none;
               display: flex; align-items: center; justify-content: center; }
  .orbe {
    position: relative; z-index: 2; width: 62px; height: 62px; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #ffffff, var(--c1) 18%, var(--c2) 55%, var(--c3) 88%);
    box-shadow: 0 6px 18px rgba(99,102,241,.45), inset 0 -4px 10px rgba(255,255,255,.4);
    animation: respire 4s ease-in-out infinite;
  }
  .anneau { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--c1); opacity: 0; }
  .anneau-tournant {
    position: absolute; inset: 4px; border-radius: 50%; opacity: 0;
    border: 3px solid transparent; border-top-color: var(--c2); border-right-color: var(--c3);
  }
  @keyframes respire { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @keyframes onde { 0% { transform: scale(.6); opacity: .85; } 100% { transform: scale(1.55); opacity: 0; } }
  @keyframes tourne { to { transform: rotate(360deg); } }
  @keyframes parle { from { transform: scale(.9); } to { transform: scale(1.16); } }
  @keyframes agit { 0%,100% { box-shadow: 0 0 18px rgba(251,191,36,.5); } 50% { box-shadow: 0 0 34px rgba(251,191,36,.9); } }

  body[data-etat="ecoute"] .orbe { background: radial-gradient(circle at 32% 30%, #ffffff, #22d3ee 18%, #0ea5e9 55%, #2563eb 88%); }
  body[data-etat="ecoute"] .anneau { animation: onde 1.6s ease-out infinite; }
  body[data-etat="ecoute"] .anneau:nth-child(2) { animation-delay: .8s; }
  body[data-etat="reflechit"] .anneau-tournant { opacity: 1; animation: tourne 1.1s linear infinite; }
  body[data-etat="parle"] .orbe { animation: parle .32s ease-in-out infinite alternate; }
  body[data-etat="agit"] .orbe { background: radial-gradient(circle at 32% 30%, #ffffff, #fbbf24 18%, #f97316 60%, #b45309 90%); animation: agit 1.2s ease-in-out infinite; }

  .message {
    min-height: 40px; max-height: 92px; overflow-y: auto; font-size: 15px; line-height: 1.4;
    font-weight: 600; color: var(--ink); padding: 0 4px; word-wrap: break-word;
    text-shadow: 0 1px 0 rgba(255,255,255,.35);
  }
  .etiquette { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muet); font-weight: 700; }

  .ligne { display: flex; gap: 10px; align-items: center; }
  input {
    flex: 1; height: 46px; border-radius: 23px; box-sizing: border-box;
    border: 1px solid rgba(255,255,255,.7);
    background: rgba(255,255,255,.4); color: var(--ink); padding: 0 20px; font-size: 15px;
    outline: none; font-family: inherit; font-weight: 500;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.08);
    transition: background .4s var(--rebond), box-shadow .4s var(--rebond);
  }
  input::placeholder { color: var(--muet); }
  input:focus { background: rgba(255,255,255,.6); box-shadow: 0 0 0 3px rgba(255,255,255,.5), inset 0 1px 3px rgba(0,0,0,.06); }

  button {
    width: 46px; height: 46px; border-radius: 50%; flex: none; cursor: pointer;
    border: 1px solid rgba(255,255,255,.7); color: var(--ink);
    background: rgba(255,255,255,.4); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 8px rgba(0,0,0,.12), inset 1px 1px 1px rgba(255,255,255,.6);
    transition: transform .5s var(--rebond), background .4s var(--rebond);
  }
  button:hover { transform: scale(1.1); background: rgba(255,255,255,.65); }
  button:active { transform: scale(.94); }
  button.principal { background: var(--ink); color: #ffffff; border-color: transparent; }
  button.principal:hover { background: #1f2937; }
  button.micro.actif { background: #0ea5e9; color: #ffffff; border-color: transparent; box-shadow: 0 0 18px rgba(14,165,233,.7); }

  .controles { display: flex; gap: 6px; align-self: flex-start; }
  .controles button {
    width: 30px; height: 30px; font-size: 13px; background: rgba(255,255,255,.35);
    box-shadow: 0 2px 5px rgba(0,0,0,.1), inset 1px 1px 1px rgba(255,255,255,.6);
  }

  svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .pywebview-drag-region { cursor: move; }
</style>
</head>
<body data-etat="repos">
  <!-- Filtre de déformation du verre (issu du style liquid glass) -->
  <svg style="position:absolute;width:0;height:0" aria-hidden="true">
    <filter id="verre-deforme" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.012" numOctaves="1" seed="17" result="turbulence"/>
      <feComponentTransfer in="turbulence" result="mapped">
        <feFuncR type="gamma" amplitude="1" exponent="10" offset="0.5"/>
        <feFuncG type="gamma" amplitude="0" exponent="1" offset="0"/>
        <feFuncB type="gamma" amplitude="0" exponent="1" offset="0.5"/>
      </feComponentTransfer>
      <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap"/>
      <feDisplacementMap in="SourceGraphic" in2="softMap" scale="22" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div class="carte">
    <div class="contenu">
      <div class="haut pywebview-drag-region">
        <div class="zone-orbe">
          <div class="anneau"></div>
          <div class="anneau"></div>
          <div class="anneau-tournant"></div>
          <div class="orbe"></div>
        </div>
        <div class="zone-drag pywebview-drag-region">
          <div class="etiquette" id="libelle">IA VOCAL</div>
          <div class="message" id="message">Dis-moi ce que tu veux.</div>
        </div>
        <div class="controles">
          <button title="Réduire" onclick="pywebview.api.minimiser()">–</button>
          <button title="Fermer" onclick="pywebview.api.quitter()">✕</button>
        </div>
      </div>

      <div class="ligne">
        <input id="saisie" placeholder="Tape ou parle…" autocomplete="off">
        <button id="micro" class="micro" title="Parler (F3)" onclick="ecouter()">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="principal" title="Envoyer (Entrée)" onclick="envoyer()">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>

<script>
  const LIBELLES = {
    repos: "IA VOCAL", ecoute: "Je t'écoute…", reflechit: "Je réfléchis…",
    parle: "Je réponds", agit: "J'agis sur ton ordinateur"
  };
  const saisie = document.getElementById("saisie");

  // Appelé par Python
  function setEtat(etat) {
    document.body.dataset.etat = etat;
    document.getElementById("libelle").textContent = LIBELLES[etat] || "IA VOCAL";
    document.getElementById("micro").classList.toggle("actif", etat === "ecoute");
  }
  function setMessage(texte) { document.getElementById("message").textContent = texte; }
  function setTexte(texte) { saisie.value = texte; }

  // Actions de l'utilisateur
  function envoyer() {
    const texte = saisie.value.trim();
    if (!texte) return;
    saisie.value = "";
    setMessage("…");
    pywebview.api.envoyer(texte);
  }
  function ecouter() { pywebview.api.ecouter(); }

  saisie.addEventListener("keydown", (e) => { if (e.key === "Enter") envoyer(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") pywebview.api.minimiser();
    if (e.key === "F3") { e.preventDefault(); ecouter(); }
  });
  saisie.focus();
</script>
</body>
</html>
