<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  :root { --c1:#7dd3fc; --c2:#6366f1; --c3:#a855f7; --txt:#e5e7eb; --muet:#94a3b8; }
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif; color: var(--txt);
  }
  .carte {
    position: absolute; inset: 10px; border-radius: 30px; box-sizing: border-box;
    padding: 14px 18px 16px;
    background: linear-gradient(160deg, rgba(30,30,48,.94), rgba(10,10,18,.96));
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    display: flex; flex-direction: column; gap: 10px;
  }
  .haut { display: flex; align-items: center; gap: 16px; }
  .zone-drag { flex: 1; height: 100%; min-height: 84px; }
  .zone-orbe { position: relative; width: 84px; height: 84px; flex: none;
               display: flex; align-items: center; justify-content: center; }
  .orbe {
    position: relative; z-index: 2; width: 62px; height: 62px; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #e0f2fe, var(--c1) 18%, var(--c2) 55%, var(--c3) 88%);
    box-shadow: 0 0 28px rgba(99,102,241,.6);
    animation: respire 4s ease-in-out infinite;
  }
  .anneau { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--c1); opacity: 0; }
  .anneau-tournant {
    position: absolute; inset: 4px; border-radius: 50%; opacity: 0;
    border: 3px solid transparent; border-top-color: var(--c1); border-right-color: var(--c3);
  }
  @keyframes respire { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @keyframes onde { 0% { transform: scale(.6); opacity: .85; } 100% { transform: scale(1.55); opacity: 0; } }
  @keyframes tourne { to { transform: rotate(360deg); } }
  @keyframes parle { from { transform: scale(.9); } to { transform: scale(1.16); } }
  @keyframes agit { 0%,100% { box-shadow: 0 0 22px rgba(251,191,36,.5); } 50% { box-shadow: 0 0 40px rgba(251,191,36,.9); } }

  body[data-etat="ecoute"] .orbe { background: radial-gradient(circle at 32% 30%, #ecfeff, #22d3ee 18%, #0ea5e9 55%, #2563eb 88%); }
  body[data-etat="ecoute"] .anneau { animation: onde 1.6s ease-out infinite; }
  body[data-etat="ecoute"] .anneau:nth-child(2) { animation-delay: .8s; }
  body[data-etat="reflechit"] .anneau-tournant { opacity: 1; animation: tourne 1.1s linear infinite; }
  body[data-etat="parle"] .orbe { animation: parle .32s ease-in-out infinite alternate; }
  body[data-etat="agit"] .orbe { background: radial-gradient(circle at 32% 30%, #fff7ed, #fbbf24 18%, #f97316 60%, #b45309 90%); animation: agit 1.2s ease-in-out infinite; }

  .message {
    min-height: 40px; max-height: 92px; overflow-y: auto; font-size: 15px; line-height: 1.4;
    padding: 0 4px; word-wrap: break-word;
  }
  .etiquette { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muet); }
  .ligne { display: flex; gap: 10px; align-items: center; }
  input {
    flex: 1; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.06); color: var(--txt); padding: 0 18px; font-size: 15px;
    outline: none; font-family: inherit;
  }
  input:focus { border-color: rgba(125,211,252,.6); box-shadow: 0 0 0 3px rgba(125,211,252,.15); }
  button {
    width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; flex: none;
    background: rgba(255,255,255,.08); color: var(--txt); display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s;
  }
  button:hover { background: rgba(255,255,255,.16); }
  button:active { transform: scale(.94); }
  button.principal { background: linear-gradient(135deg, var(--c2), var(--c3)); }
  button.principal:hover { background: linear-gradient(135deg, #818cf8, #c084fc); }
  button.micro.actif { background: #0ea5e9; box-shadow: 0 0 18px rgba(14,165,233,.7); }
  .controles { display: flex; gap: 6px; }
  .controles button { width: 28px; height: 28px; font-size: 14px; background: transparent; color: var(--muet); }
  .controles button:hover { color: var(--txt); background: rgba(255,255,255,.08); }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pywebview-drag-region { cursor: move; }
</style>
</head>
<body data-etat="repos">
  <div class="carte">
    <div class="haut pywebview-drag-region">
      <div class="zone-orbe">
        <div class="anneau"></div>
        <div class="anneau"></div>
        <div class="anneau-tournant"></div>
        <div class="orbe"></div>
      </div>
      <div class="zone-drag pywebview-drag-region">
        <div class="etiquette" id="libelle">IA VOCAL</div>
        <div class="message" id="message">Dis-moi ce que tu veux.</div>
      </div>
      <div class="controles">
        <button title="Réduire" onclick="pywebview.api.minimiser()">–</button>
        <button title="Fermer" onclick="pywebview.api.quitter()">✕</button>
      </div>
    </div>

    <div class="ligne">
      <input id="saisie" placeholder="Tape ou parle…" autocomplete="off">
      <button id="micro" class="micro" title="Parler (F3)" onclick="ecouter()">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="principal" title="Envoyer (Entrée)" onclick="envoyer()">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

<script>
  const LIBELLES = {
    repos: "IA VOCAL", ecoute: "Je t'écoute…", reflechit: "Je réfléchis…",
    parle: "Je réponds", agit: "J'agis sur ton ordinateur"
  };
  const saisie = document.getElementById("saisie");

  // Appelé par Python
  function setEtat(etat) {
    document.body.dataset.etat = etat;
    document.getElementById("libelle").textContent = LIBELLES[etat] || "IA VOCAL";
    document.getElementById("micro").classList.toggle("actif", etat === "ecoute");
  }
  function setMessage(texte) { document.getElementById("message").textContent = texte; }
  function setTexte(texte) { saisie.value = texte; }

  // Actions de l'utilisateur
  function envoyer() {
    const texte = saisie.value.trim();
    if (!texte) return;
    saisie.value = "";
    setMessage("…");
    pywebview.api.envoyer(texte);
  }
  function ecouter() { pywebview.api.ecouter(); }

  saisie.addEventListener("keydown", (e) => { if (e.key === "Enter") envoyer(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") pywebview.api.minimiser();
    if (e.key === "F3") { e.preventDefault(); ecouter(); }
  });
  saisie.focus();
</script>
</body>
</html>
