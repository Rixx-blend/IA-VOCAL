name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances de build
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Compiler IA-VOCAL.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name IA-VOCAL run.py

      - name: Publier l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: IA-VOCAL-windows
          path: dist/IA-VOCAL.exe
